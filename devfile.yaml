schemaVersion: 2.2.2
metadata:
  name: dev-workflow-ai
  generateName: dev-workflow-ai-
  description: Autonomous AI software engineer for Eclipse Che — issue→PR→review→fix loop

components:
  - name: tools
    container:
      image: quay.io/oorel/dev-workflow-ai:latest
      args: ["tail", "-f", "/dev/null"]
      memoryLimit: 4G
      memoryRequest: 512Mi
      cpuRequest: 1000m
      cpuLimit: 4000m
      mountSources: true
      endpoints:
        - exposure: public
          name: app
          protocol: https
          targetPort: 3000
          path: /
        - exposure: public
          name: webpack-dev
          protocol: https
          targetPort: 5173
          path: /
        - exposure: public
          name: swagger
          protocol: https
          targetPort: 3000
          path: /swagger
      env:
        # PGlite — embedded Postgres-in-WASM, no sidecar needed.
        # Data directory is inside /projects/ which is PVC-backed in Eclipse Che
        # (survives pod restarts). Remove this var to use in-memory PGlite instead.
        - name: PGLITE_DATA_DIR
          value: "/projects/.data/pglite"
        - name: KNOWLEDGE_DIR
          value: "${PROJECT_SOURCE}/pg_seed/eclipse-che"
        # LLM backend — set one of these (or configure via Settings → AI Providers)
        - name: ANTHROPIC_VERTEX_PROJECT_ID
          value: ""
        - name: CLOUD_ML_REGION
          value: ""
        - name: VERTEX_CLAUDE_MODEL
          value: ""
        - name: GOOGLE_APPLICATION_CREDENTIALS_JSON
          value: ""
        - name: ANTHROPIC_API_KEY
          value: ""
        - name: GEMINI_API_KEY
          value: ""
        # External Ollama on your intranet — leave empty to use Vertex AI / Claude / Gemini
        - name: OLLAMA_BASE_URL
          value: ""
        - name: OLLAMA_MODEL
          value: "qwen2.5-coder:7b"
        # GitHub — required for real PR creation; omit for dry-run mode
        # Injected automatically when 'dev-workflow-ai-secrets' Secret exists:
        #   label   controller.devfile.io/mount-to-devworkspace: "true"
        #   annotation controller.devfile.io/mount-as: env
        # Create the secret once with: ./run/create-ocp-secret.sh
        - name: GITHUB_TOKEN
          value: ""
        # Jira — required for assigned-to-me issue sync
        - name: JIRA_TOKEN
          value: ""
        - name: JIRA_EMAIL
          value: ""
        - name: JIRA_BASE_URL
          value: "https://redhat.atlassian.net"

commands:
  - id: install
    exec:
      label: "[DWA] install dependencies"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn install"
      group:
        kind: build
        isDefault: true

  - id: build
    exec:
      label: "[DWA] build (UI + API)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "./build/build.sh"
      group:
        kind: build

  - id: build-ui
    exec:
      label: "[DWA] build UI only (webpack)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "./build/build.sh --ui-only"
      group:
        kind: build

  - id: build-api
    exec:
      label: "[DWA] build API only (webpack)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "./build/build.sh --api-only"
      group:
        kind: build

  - id: start-api
    exec:
      label: "[DWA] start API (dev mode, PGlite)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn dev:api"
      group:
        kind: run
        isDefault: true

  - id: start-ui
    exec:
      label: "[DWA] start UI dev server (webpack, port 5173)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn dev:ui"
      group:
        kind: run

  - id: test
    exec:
      label: "[DWA] run tests"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn test"
      group:
        kind: test
        isDefault: true

  - id: lint
    exec:
      label: "[DWA] lint"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn lint"
      group:
        kind: test

  - id: typecheck
    exec:
      label: "[DWA] typecheck"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn typecheck"
      group:
        kind: test

  - id: run-issue
    exec:
      label: "[DWA] run agent on issue (direct)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "echo 'Usage: npx tsx scripts/run-issue-direct.ts <github-issue-url>'"
      group:
        kind: run

  - id: install-claude-code
    exec:
      label: "[DWA] install Claude Code CLI"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "npm install -g @anthropic-ai/claude-code"

  - id: install-gemini-cli
    exec:
      label: "[DWA] install Gemini CLI"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "npm install -g @google/gemini-cli"

  - id: license-generate
    exec:
      label: "[DWA] generate license files"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn license:generate"
      group:
        kind: build
