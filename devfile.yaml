schemaVersion: 2.2.2
metadata:
  name: dev-workflow-ai
  generateName: dev-workflow-ai-
  description: Autonomous AI software engineer for Eclipse Che — issue→PR→review→fix loop

components:
  - name: tools
    container:
      image: quay.io/oorel/dev-workflow-ai:latest
      memoryLimit: 6G
      memoryRequest: 1024Mi
      cpuRequest: 1000m
      cpuLimit: 4000m
      mountSources: true
      endpoints:
        - exposure: public
          name: app
          protocol: https
          targetPort: 3000
          path: /
        - exposure: public
          name: webpack-dev
          protocol: https
          targetPort: 5173
          path: /
        - exposure: public
          name: swagger
          protocol: https
          targetPort: 3000
          path: /swagger
      env:
        # ── Non-sensitive config (safe to hardcode) ───────────────────────────
        # PGlite: embedded Postgres-in-WASM, persisted on the PVC at /projects/
        - name: PGLITE_DATA_DIR
          value: "/projects/.data/pglite"
        - name: KNOWLEDGE_DIR
          value: "${PROJECT_SOURCE}/pg_seed/eclipse-che"
        - name: OLLAMA_MODEL
          value: "qwen2.5-coder:7b"
        # ── Credentials — injected from OpenShift secret ─────────────────────
        # All credential env vars (GITHUB_TOKEN, ANTHROPIC_*, GEMINI_API_KEY,
        # JIRA_TOKEN, JIRA_EMAIL, JIRA_BASE_URL, GOOGLE_APPLICATION_CREDENTIALS_JSON)
        # must NOT be listed here. Define them in the 'dev-workflow-ai-secrets'
        # Secret and label it so the DevWorkspace Operator auto-injects them:
        #
        #   controller.devfile.io/mount-to-devworkspace: "true"
        #   controller.devfile.io/mount-as: env
        #
        # Create the secret before opening this workspace:
        #   cp .env.example .env  # fill in your values
        #   ./run/create-ocp-secret.sh --namespace <ns>
        #
        # Any env var defined here with value: "" would OVERRIDE the secret
        # injection and give the container an empty string instead of the
        # secret value — that is why credentials are absent from this list.

commands:
  - id: start-prepare
    exec:
      label: "[DWA] start:prepare — seed DB + start API (first run)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn start:prepare"
      group:
        kind: run
        isDefault: true

  - id: dev
    exec:
      label: "[DWA] dev — start API only (PGlite, hot-reload)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn dev"
      group:
        kind: run

  - id: start
    exec:
      label: "[DWA] start — frontend dev server (port 5173)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn start"
      group:
        kind: run

  - id: build
    exec:
      label: "[DWA] build — UI + API (production webpack)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn build"
      group:
        kind: build
        isDefault: true

  - id: test
    exec:
      label: "[DWA] test"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn test"
      group:
        kind: test
        isDefault: true

  - id: run-issue
    exec:
      label: "[DWA] run-issue — run agent directly on an issue URL"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn run-issue"
      group:
        kind: run

  - id: license-generate
    exec:
      label: "[DWA] license:generate"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn license:generate"
      group:
        kind: build
