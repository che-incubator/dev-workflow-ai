schemaVersion: 2.2.2
metadata:
  name: dev-workflow-ai
  generateName: dev-workflow-ai-
  description: Autonomous AI software engineer for Eclipse Che — issue→PR→review→fix loop

components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 6G
      memoryRequest: 1024Mi
      cpuRequest: 1000m
      cpuLimit: 4000m
      mountSources: true
      endpoints:
        - exposure: public
          name: app
          protocol: https
          targetPort: 3000
          path: /
        - exposure: public
          name: webpack-dev
          protocol: https
          targetPort: 5173
          path: /
        - exposure: public
          name: swagger
          protocol: https
          targetPort: 3000
          path: /swagger
      env:
        - name: PGLITE_DATA_DIR
          value: "/projects/.data/pglite"
        - name: KNOWLEDGE_DIR
          value: "${PROJECT_SOURCE}/pg_seed/eclipse-che"
        - name: OLLAMA_MODEL
          value: "qwen2.5-coder:7b"

commands:
  - id: build
    exec:
      label: "[DWA] build — backend + frontend webpack"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn build"
      group:
        kind: build
        isDefault: true

  - id: prepare-db
    exec:
      label: "[DWA] prepare:db — seed DB from pg_seed/"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn prepare:db"
      group:
        kind: run

  - id: start
    exec:
      label: "[DWA] start — run built API server (port 3000)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn start"
      group:
        kind: run

  - id: start-watch
    exec:
      label: "[DWA] start:watch — dev mode (tsx hot-reload)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn start:watch"
      group:
        kind: run
        isDefault: true

  - id: start-frontend
    exec:
      label: "[DWA] start:frontend — webpack dev server (port 5173)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn start:frontend"
      group:
        kind: run

  - id: test
    exec:
      label: "[DWA] test"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn test"
      group:
        kind: test
        isDefault: true

  - id: license-generate
    exec:
      label: "[DWA] license:generate"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "yarn license:generate"
      group:
        kind: build
